name: tests

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-smoke:
    name: test / smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout styio.io
        uses: actions/checkout@v5

      - name: Run smoke tests
        run: scripts/smoke-site.sh

  test-golden-standard:
    name: test / golden-standard
    needs: [test-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout styio.io
        uses: actions/checkout@v5

      - name: Run golden-standard tests
        run: |
          scripts/smoke-site.sh
          scripts/build-site.sh _golden_site
          scripts/validate-release-root.sh _golden_site
